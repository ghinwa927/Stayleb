# Alembic configuration for the StayLeb backend.
#
# The database URL is NEVER stored here. It is read from the
# DATABASE_URL environment variable at runtime (same variable the
# FastAPI app uses). Run all alembic commands from backend/ so that
# the relative script_location below resolves correctly.

[alembic]
script_location = alembic
# Placeholder only: env.py replaces this with DATABASE_URL from the
# environment. Do not put credentials in this file.
sqlalchemy.url =

prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
